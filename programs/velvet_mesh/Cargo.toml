[package]
name = "velvet_mesh"
version = "0.1.0"
description = "Private intent/RFQ layer for VelvetMesh by VelvetSwap"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "velvet_mesh"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
no-log-ix-name = []

[dependencies]
anchor-lang = "0.31.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(target_os, values(\"solana\"))"] }
