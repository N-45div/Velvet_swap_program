[package]
name = "velvet_mesh_matcher"
version = "0.1.0"
description = "Arcium private quote matcher for VelvetMesh"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "velvet_mesh_matcher"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
arcium-client = { default-features = false, version = "=0.9.7" }
arcium-macros = "=0.9.7"
arcium-anchor = "=0.9.7"
unicode-segmentation = { version = "=1.12.0" }
indexmap = { workspace = true }
